spring:
  application:
    name: indux-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${INDUX_DB_URL:jdbc:postgresql://localhost:5432/indux}
    username: ${INDUX_DB_USERNAME}
    password: ${INDUX_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

indux:
  jwt:
    secret: ${INDUX_JWT_SECRET}
    expiracion-minutos: 120
  cors:
    origen-permitido: ${INDUX_CORS_ORIGEN:http://localhost:4200}
  admin:
    email: ${INDUX_ADMIN_EMAIL:admin@indux.com}
    password: ${INDUX_ADMIN_PASSWORD}
